# =============================================================================
# personal-template / root Taskfile (= template state)
# =============================================================================
# At template state only `task init` is exposed. After init the real Taskfile
# from `_core/Taskfile.yml` lands here and the full `task --list` becomes
# available (= setup / lint / test / build / docs:check / py:* etc.).
# =============================================================================

version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  init:
    desc: Initialize this template for a new project (= multiselect overlays, then promote)
    vars:
      OVERLAYS: '{{.OVERLAYS | default ""}}'
    cmds:
      - OVERLAYS={{.OVERLAYS}} python3 _core/scripts/init.py

  install:core:
    desc: Install _core machinery into another existing repo (= TARGET=/path, optional DRY_RUN=1)
    vars:
      TARGET: '{{.TARGET}}'
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - TARGET={{.TARGET}} DRY_RUN={{.DRY_RUN}} bash _core/scripts/install-core.sh

  install:overlay:
    desc: Install a single language overlay into another existing repo (= NAME=<lang> TARGET=/path)
    vars:
      NAME: '{{.NAME}}'
      TARGET: '{{.TARGET}}'
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - DRY_RUN={{.DRY_RUN}} bash _core/scripts/install-overlay.sh {{.NAME}} {{.TARGET}}
