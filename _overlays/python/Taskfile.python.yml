# =============================================================================
# personal-template / Python overlay Taskfile
# =============================================================================
# Python-specific tasks namespaced under `py:`. The core Taskfile.yml includes
# this file as `py:` so callers use `task py:lint`, `task py:test:unit`, etc.
#
# OS dispatch follows the same pattern as the rest of the template: bash on
# macOS/Ubuntu, PowerShell on Windows. Per-language scripts live under
# `.tooling/os/<os>/python/`.
# =============================================================================

version: '3'

tasks:
  setup:
    desc: Initial Python setup (.venv, deps, git hooks)
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -ExecutionPolicy Bypass -File .tooling/os/windows/python/setup.ps1
        {{else}}
        bash .tooling/os/{{if eq OS "darwin"}}macos{{else}}ubuntu{{end}}/python/setup.sh
        {{end}}

  update:
    desc: Update Python dependencies
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -ExecutionPolicy Bypass -File .tooling/os/windows/python/update.ps1
        {{else}}
        bash .tooling/os/{{if eq OS "darwin"}}macos{{else}}ubuntu{{end}}/python/update.sh
        {{end}}

  lint:
    desc: Run Python lint (black + flake8 + anon-scan)
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -ExecutionPolicy Bypass -File .tooling/os/windows/python/lint.ps1
        {{else}}
        bash .tooling/os/{{if eq OS "darwin"}}macos{{else}}ubuntu{{end}}/python/lint.sh
        {{end}}

  test:unit:
    desc: Run Python unit tests
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -ExecutionPolicy Bypass -File .tooling/os/windows/python/test-unit.ps1
        {{else}}
        bash .tooling/os/{{if eq OS "darwin"}}macos{{else}}ubuntu{{end}}/python/test-unit.sh
        {{end}}

  test:integration:
    desc: Run Python integration tests
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -ExecutionPolicy Bypass -File .tooling/os/windows/python/test-integration.ps1
        {{else}}
        bash .tooling/os/{{if eq OS "darwin"}}macos{{else}}ubuntu{{end}}/python/test-integration.sh
        {{end}}

  build:
    desc: Build the python deliverable (= aliases py:build:exe for symmetry with other overlays)
    cmds:
      - task: build:exe

  build:exe:
    desc: Build standalone executable with PyInstaller
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -ExecutionPolicy Bypass -File .tooling/os/windows/python/build-exe.ps1
        {{else}}
        bash .tooling/os/{{if eq OS "darwin"}}macos{{else}}ubuntu{{end}}/python/build-exe.sh
        {{end}}

  run:
    desc: Run the python application (= aliases py:run:api for symmetry with other overlays)
    cmds:
      - task: run:api

  run:api:
    desc: Start FastAPI server
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -ExecutionPolicy Bypass -File .tooling/os/windows/python/run-api.ps1
        {{else}}
        bash .tooling/os/{{if eq OS "darwin"}}macos{{else}}ubuntu{{end}}/python/run-api.sh
        {{end}}
