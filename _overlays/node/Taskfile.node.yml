# =============================================================================
# personal-template / Node overlay Taskfile
# =============================================================================
# Node-specific tasks namespaced under `node:`. Inline commands (= no per-OS
# scripts) because npm + node behave identically across macOS/Ubuntu/Windows.
# =============================================================================

version: '3'

tasks:
  setup:
    desc: Install dependencies
    cmds:
      - npm install

  update:
    desc: Update dependencies
    cmds:
      - npm update

  lint:
    desc: Run eslint + prettier --check
    cmds:
      - npm run lint

  test:unit:
    desc: Run unit tests (= vitest run)
    cmds:
      - npm run test:unit

  test:integration:
    desc: Run integration tests
    cmds:
      - npm run test:integration

  build:
    desc: Build TypeScript -> dist/
    cmds:
      - npm run build

  run:
    desc: Start the built artefact
    cmds:
      - npm start
