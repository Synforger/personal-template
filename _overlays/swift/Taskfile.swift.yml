# =============================================================================
# personal-template / Swift overlay Taskfile
# =============================================================================
# Swift-specific tasks namespaced under `swift:`. SwiftPM CLI on macOS/Linux;
# Windows Swift support is experimental (= overlay assumes macOS or Linux).
# =============================================================================

version: '3'

tasks:
  setup:
    desc: Resolve dependencies
    cmds:
      - swift package resolve

  update:
    desc: Update Package.resolved
    cmds:
      - swift package update

  lint:
    desc: Run swift-format lint (= skip with warning if swift-format absent)
    cmds:
      - |
        if command -v swift-format >/dev/null 2>&1; then
          swift-format lint -r Sources Tests
        else
          echo "warning: swift-format not installed (brew install swift-format); lint skipped"
        fi

  test:unit:
    desc: Run unit tests
    cmds:
      - swift test

  test:integration:
    desc: Run integration tests (= when split via naming convention)
    cmds:
      - swift test

  build:
    desc: Release build
    cmds:
      - swift build -c release

  run:
    desc: Run executable target (= when defined in Package.swift products)
    cmds:
      - swift run
