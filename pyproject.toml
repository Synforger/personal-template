[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-package"
dynamic = ["version"]
requires-python = ">=3.10"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "synforger" }]
description = ""
keywords = []
dependencies = [
    "numpy>=1.20.0",
    "rich>=13.0.0",
    "omegaconf>=2.3.0",
    # プライベートリポジトリの依存関係を追加する場合は以下のようにPEP 508形式で記述してください
]

[project.optional-dependencies]
dev = [
    "flake8==7.3.0",
    "darglint==1.8.1",
    "mypy==1.19.1",
    "black==26.3.1",
    "isort==8.0.1",
    "pytest==9.0.2",
    "pytest-sphinx==0.7.1",
    "pytest-cov==7.1.0",
    "setuptools",
    "wheel",
    "build",
    "sphinx_rtd_theme",
    "myst-parser==4.0.1",
    "sphinx-copybutton==0.5.2",
    "sphinx-autobuild==2024.10.3; python_version < '3.11'",
    "sphinx-autobuild>=2025.8.25; python_version >= '3.11'",
    "sphinx-autodoc-typehints==2.3.0",
    "packaging==26.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "pillow>=9.0.0",
]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pillow>=9.0.0",
]
pyinstaller = [
    "pyinstaller>=6.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
my_package = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "my_package.version.VERSION" }

[tool.bumpversion]
current_version = "0.1.13"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "src/my_package/version.py"
search = "_MAJOR = \"{current_major}\""
replace = "_MAJOR = \"{new_major}\""

[[tool.bumpversion.files]]
filename = "src/my_package/version.py"
search = "_MINOR = \"{current_minor}\""
replace = "_MINOR = \"{new_minor}\""

[[tool.bumpversion.files]]
filename = "src/my_package/version.py"
search = "_PATCH = \"{current_patch}\""
replace = "_PATCH = \"{new_patch}\""
