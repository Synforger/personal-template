# =============================================================================
# personal-template / version bump targets
# =============================================================================
# Single source of truth for the project version + which files
# `version-bump.sh` / `release-cut.sh` rewrite when the version changes.
#
# Active overlays add their own entries during `task init` (= each overlay
# ships a snippet in its README explaining what to append). Removing an
# overlay should remove the corresponding entry by hand.
#
# Placeholders inside search / replace:
#   {OLD}         = e.g. "0.1.13"
#   {NEW}         = e.g. "0.1.14"
#   {OLD_MAJOR}   = e.g. "0"
#   {OLD_MINOR}   = e.g. "1"
#   {OLD_PATCH}   = e.g. "13"
#   {NEW_MAJOR}   = e.g. "0"
#   {NEW_MINOR}   = e.g. "1"
#   {NEW_PATCH}   = e.g. "14"
#
# Adding a new file: pick the smallest pattern that uniquely identifies the
# version literal, prefer keeping the surrounding line literal so a stray
# match elsewhere in the file cannot fire by accident.
# =============================================================================

current_version: "0.1.13"

targets:
  # Python overlay: split _MAJOR/_MINOR/_PATCH lines in src/my_package/version.py
  - file: src/my_package/version.py
    replacements:
      - search: '_MAJOR = "{OLD_MAJOR}"'
        replace: '_MAJOR = "{NEW_MAJOR}"'
      - search: '_MINOR = "{OLD_MINOR}"'
        replace: '_MINOR = "{NEW_MINOR}"'
      - search: '_PATCH = "{OLD_PATCH}"'
        replace: '_PATCH = "{NEW_PATCH}"'
