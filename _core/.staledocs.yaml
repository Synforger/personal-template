# staledocs — deterministic code<->docs drift detection (docs:coherence gate).
# Ships in warn mode: declare your pairs as code lands, then flip to strict.
# Docs: https://github.com/Synforger/staledocs
version: 1

# warn = report only (onboarding). Flip to strict once `staledocs pairs`
# shows no unclassified docs / uncovered source — from then on drift blocks CI.
gate: warn

source:
  include:
    - "src/**"
    # - "scripts/**"   # opt in once your scripts deserve owning docs
  exclude:
    # template-shipped machinery is documented in docs/internals (excluded)
    - "scripts/gen-third-party-notices.py"
    - "scripts/init.py"
    - "scripts/install-core.sh"
    - "scripts/post-init-github-settings.sh"
    - "scripts/setup-branch-protection.sh"

# Every tracked .md is in scope: staledocs is the single owner of path/anchor
# liveness (docs-check.sh deliberately does not verify inline path references).
docs:
  include:
    - "docs/**/*.md"
    - "*.md"
    - ".github/**/*.md"
  exclude: []

# Explicit pairs (CODEOWNERS-style): a doc owns the code its globs match.
pairs: []
#  - doc: docs/reference/README.md
#    code: ["src/**"]

# Convention pairing: docs/<name>.md <-> src/<name>/** or src/<name>.*
mirror:
  enabled: true
  docs_root: docs
  code_roots: [src]

# Docs with intentionally no code side (setup guides, runbooks, meta docs).
# Standalone docs still get their path-like anchors verified repo-wide —
# that is what replaced docs-check's old inline-path check.
standalone:
  - "docs/README.md"
  - "docs/setup/**"
  - "docs/troubleshooting/**"
  - "docs/reference/**"   # pair this to your code once the API surface exists
  - "docs/internals/**"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "ROADMAP.md"
  - "THIRD_PARTY_NOTICES.md"
  - ".github/**"

# Whole-repo docs: anchor liveness only, no pair ledger.
global:
  - README.md
  - README.ja.md

anchors:
  min_length: 3
  ignore: []
  include_fenced: false
