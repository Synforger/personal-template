# =============================================================================
# personal-template / core Taskfile
# =============================================================================
# This Taskfile defines language-neutral tasks (anonymity / docs / hooks /
# GitHub settings) plus delegating wrappers that fan out to whichever language
# overlays are active.
#
# At template state (= before `task init`) this file lives under `_core/`.
# After `task init` runs in a derived repo, this file is moved to the repo
# root and the chosen overlays' `Taskfile.<lang>.yml` files are included from
# the same root. Includes are marked `optional` so missing overlays do not
# error out — they just contribute no tasks.
# =============================================================================

version: '3'

includes:
  py:
    taskfile: ./Taskfile.python.yml
    optional: true
  node:
    taskfile: ./Taskfile.node.yml
    optional: true
  rust:
    taskfile: ./Taskfile.rust.yml
    optional: true
  swift:
    taskfile: ./Taskfile.swift.yml
    optional: true
  kotlin:
    taskfile: ./Taskfile.kotlin.yml
    optional: true
  cs:
    taskfile: ./Taskfile.csharp.yml
    optional: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Language-neutral fan-out wrappers — generated by `task init`.
  # At template state these are stubs that point at the python overlay only;
  # `init.py` rewrites the cmds blocks to fan out across whichever overlays
  # the user picked. Always keep the names + descriptions stable here so the
  # rewrite logic in init.py is a pure cmds-list substitution.
  # ---------------------------------------------------------------------------
  setup:
    desc: Initial setup (= fan-out to <overlay>:setup for every selected overlay)
    cmds:
      - task: py:setup

  update:
    desc: Update dependencies (= fan-out to <overlay>:update)
    cmds:
      - task: py:update

  lint:
    desc: Run lint across active overlays (= fan-out to <overlay>:lint)
    cmds:
      - task: py:lint

  test:unit:
    desc: Run unit tests across active overlays (= fan-out to <overlay>:test:unit)
    cmds:
      - task: py:test:unit

  test:integration:
    desc: Run integration tests across active overlays (= fan-out to <overlay>:test:integration)
    cmds:
      - task: py:test:integration

  build:
    desc: Build artefacts across active overlays (= fan-out to <overlay>:build)
    cmds:
      - task: py:build

  run:
    desc: Run the application across active overlays (= fan-out to <overlay>:run)
    cmds:
      - task: py:run

  # ---------------------------------------------------------------------------
  # Language-neutral quality gates (no delegation).
  # ---------------------------------------------------------------------------
  docs:check:
    desc: Verify docs freshness (paths / task names / tree diagrams vs reality)
    cmds:
      - bash .tooling/local-ci/docs-check.sh

  doctor:
    desc: Preflight diagnostic — report MISSING / TOO OLD / OK for every toolchain entry
    cmds:
      - bash .tooling/local-ci/doctor.sh

  lint:versions:
    desc: Detect downstream toolchain drift vs .tooling/versions.yaml truth
    cmds:
      - bash .tooling/local-ci/lint-versions.sh

  gen-notices:
    desc: Regenerate THIRD_PARTY_NOTICES.md from the installed dep tree (python + node + rust)
    cmds:
      - python3 scripts/gen-third-party-notices.py

  audit:
    desc: Aggregate security audit (anon-scan + gitleaks full history + pip-audit + npm audit + cargo audit)
    cmds:
      - bash .tooling/local-ci/audit.sh

  audit:deep:
    desc: Deep anon audit across 10 sources (= git history blob + commit msg + branch/tag + author + GitHub PR/Issue/desc/release)
    cmds:
      - bash .tooling/local-ci/anon-sync-truth.sh
      - bash .tooling/local-ci/anon-audit-deep.sh

  audit:sync-truth:
    desc: Pull anon-words.txt from the operator's master truth (= ANON_TRUTH_PATH env or platform default)
    cmds:
      - bash .tooling/local-ci/anon-sync-truth.sh

  clean:
    desc: Per-layer clean (LAYER=python|node|rust|swift|kotlin|cs|docs|all, default=all)
    vars:
      LAYER: '{{.LAYER | default "all"}}'
    cmds:
      - bash .tooling/local-ci/clean.sh {{.LAYER}}

  version:bump:
    desc: Bump version in bump-targets.yaml + listed files (LEVEL=patch|minor|major, DRY_RUN=1 for plan-only)
    vars:
      LEVEL: '{{.LEVEL | default "patch"}}'
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - LEVEL={{.LEVEL}} DRY_RUN={{.DRY_RUN}} bash .tooling/local-ci/version-bump.sh

  release:cut:
    desc: Bump version + commit + tag + push (LEVEL=patch|minor|major, SKIP_PUSH=1 to keep local, DRY_RUN=1 for plan-only)
    vars:
      LEVEL: '{{.LEVEL | default "patch"}}'
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
      SKIP_PUSH: '{{.SKIP_PUSH | default "0"}}'
    cmds:
      - LEVEL={{.LEVEL}} DRY_RUN={{.DRY_RUN}} SKIP_PUSH={{.SKIP_PUSH}} bash .tooling/local-ci/release-cut.sh

  setup:branch-protection:
    desc: Setup branch protection rules for the main branch
    cmds:
      - bash scripts/setup-branch-protection.sh

  init:github:
    desc: Apply post-template GitHub settings (= secret scanning, PVR, merge config, branch protection)
    vars:
      OWNER: '{{.OWNER | default ""}}'
      REPO: '{{.REPO | default ""}}'
    cmds:
      - OWNER={{.OWNER}} REPO={{.REPO}} bash scripts/post-init-github-settings.sh
